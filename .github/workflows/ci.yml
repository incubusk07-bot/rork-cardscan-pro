name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Install and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: expo
        run: bun install --frozen-lockfile

      - name: Guard against stray npm/yarn lock files
        working-directory: expo
        run: rm -f package-lock.json yarn.lock pnpm-lock.yaml

      - name: Build Android APK via EAS
        working-directory: expo
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
